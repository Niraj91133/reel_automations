name: Startup Road Cloud Reel Automation

on:
  schedule:
    # Runs everyday at 00:30 UTC (6:00 AM IST) and 10:30 UTC (4:00 PM IST)
    - cron: '30 0 * * *'
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      reel_count:
        description: 'Number of reels to generate & publish'
        required: true
        default: '5'

permissions:
  contents: write

jobs:
  process-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core python3-pip python3-venv

      - name: Set up Virtual Environment & Install Packages
        run: |
          python3 -m venv venv
          . venv/bin/activate
          pip install --upgrade pip
          pip install yt-dlp pillow google-genai requests playwright
          playwright install --with-deps chromium

      - name: Run Startup Road Pipeline (im_raaaj_ -> @startup_road)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN || 'EAAhE6xjRCjsBSZCd3fgqJoUWapdxBk04aDy4ufC7Dt2g79hhSLH2f5M0OZCbYSLtr3ZAZB5Q4ovYCBUORa8G5zeB4l2ZBfdYjBOTjXAwKFq9cZBfYZBEWjIvjH0E17kceTkpTwZAsVKatVNA2TBfhh9ilzMY1y4wXepzD1dXgBAtx0xTDoy11O20zhgH0ZAuDyfFm3B1pl0g1NTvZBLvkeZBmpccEft84iLLCdI5QKk6cJs7QZDZD' }}
          INSTAGRAM_ACCOUNT_ID: "17841464149880503"
          TELEGRAM_BOT_TOKEN: "8149202459:AAGRZBE4uZY7UXUV4HySazIuc-M5V2hHK8A"
          TELEGRAM_CHAT_ID: "711598335"
        run: |
          . venv/bin/activate
          COUNT="${{ github.event.inputs.reel_count || '5' }}"
          python run_dm_automation.py "$COUNT" || true

      - name: Commit & Push Updated Databases (Prevent duplicates)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add reels_history.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Update history DB [skip ci]" && git push)
