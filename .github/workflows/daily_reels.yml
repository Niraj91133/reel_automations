name: Daily Instagram Reel Automation

on:
  schedule:
    # Runs everyday at 03:30 UTC = 9:00 AM IST
    - cron: '30 3 * * *'
  # Allows manual 1-click trigger from GitHub website anytime!
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore Processed Reels Database
        run: |
          python -c "from db import init_db; init_db()"

      - name: Run Reel Automation Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python run_dm_automation.py 10

      - name: Commit & Push Updated Database (To prevent duplicates)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add reels_history.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Update reels history DB [skip ci]" && git push)
