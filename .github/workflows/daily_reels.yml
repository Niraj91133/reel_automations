name: Daily Instagram Reel Automation

on:
  schedule:
    # Runs everyday at 03:30 UTC = 9:00 AM IST
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core python3-pip python3-venv

      - name: Set up Virtual Environment & Install Packages
        run: |
          python3 -m venv venv
          . venv/bin/activate
          pip install --upgrade pip
          pip install yt-dlp pillow google-genai requests playwright
          playwright install --with-deps chromium

      - name: Run Pipeline 1: Startup Channel (im_raaaj_ -> Bot 1)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: "8149202459:AAGRZBE4uZY7UXUV4HySazIuc-M5V2hHK8A"
          TELEGRAM_CHAT_ID: "711598335"
        run: |
          . venv/bin/activate
          python run_dm_automation.py 10 || true

      - name: Run Pipeline 2: Politics Channel (baatleaderki -> News Bot)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLITICS_BOT_TOKEN: "8997893199:AAEUxCeRiVupFV9KElzdsni2kTre7klWteM"
          POLITICS_CHAT_ID: "5903254012"
        run: |
          . venv/bin/activate
          python run_politics_automation.py 10 || true

      - name: Commit & Push Updated Databases (To prevent duplicates)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add reels_history.db politics_history.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Update history DBs [skip ci]" && git push)
